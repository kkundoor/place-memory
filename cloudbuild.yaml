steps:
  - name: python:3.12-slim
    dir: api
    entrypoint: bash
    args:
      - -c
      - pip install -r requirements.txt && pytest -q && python ../evals/run_resolution_eval.py

  - name: node:22
    dir: web
    entrypoint: bash
    args:
      - -c
      - npm ci && npm run build

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/place-memory:$COMMIT_SHA
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/place-memory:$COMMIT_SHA

substitutions:
  _REGION: us-central1
  _REPOSITORY: place-memory
