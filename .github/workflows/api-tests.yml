name: ci

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: resolver synthetic safety eval
        run: python ../evals/run_resolution_eval.py
      - name: resolver field safety eval
        run: python ../evals/run_field_resolution_eval.py
      - name: resolver redesign invariants
        run: python -m pytest ../evals/spec_tests/test_resolver_redesign_spec.py -q
      - name: real artifact pilot metric semantics
        run: python -m pytest ../evals/spec_tests/test_real_artifact_pilot_metrics.py -q

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-mcp.txt
      - name: import MCP server
        run: python -c "from app.mcp_server import mcp; print(mcp.name if hasattr(mcp, 'name') else 'place-memory')"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
